<style>
@import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap");
:root {
  --bg: #0f1221;
  --card: #171b2e;
  --ink: #eef0fa;
  --muted: #8b91b0;
  --grid: #2a3050;
  --bar-low: #5b6cff;
  --bar-high: #ff7a59;
  --accent: #ffd36e;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px 16px;
  background: radial-gradient(circle at 20% 0%, #232a52 0%, var(--bg) 55%);
  color: var(--ink);
  font-family: "Inter", system-ui, sans-serif;
}

.card {
  width: min(1000px, 100%);
  background: var(--card);
  border: 1px solid #262c48;
  border-radius: 20px;
  padding: 28px 28px 20px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
}

.eyebrow {
  margin: 0;
  color: var(--accent);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

#title {
  margin: 6px 0 4px;
  font-family: "Fraunces", Georgia, serif;
  font-size: clamp(1.8rem, 4vw, 2.6rem);
  font-weight: 600;
}

.subtitle {
  margin: 0 0 16px;
  color: var(--muted);
}

.chart svg {
  display: block;
  width: 100%;
  height: auto;
}

.axis text {
  fill: var(--muted);
  font-family: "Inter", system-ui, sans-serif;
  font-size: 11px;
}

.axis path,
.axis line {
  stroke: var(--grid);
}

.grid line {
  stroke: var(--grid);
  stroke-dasharray: 2 4;
}

.grid path {
  display: none;
}

.axis-label {
  fill: var(--muted);
  font-size: 12px;
}

.bar {
  transition: opacity 120ms ease;
}

.bar:hover,
.bar.active {
  fill: var(--accent);
}

footer {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px;
  margin-top: 8px;
  color: var(--muted);
  font-size: 0.8rem;
}

footer a {
  color: var(--muted);
}

#tooltip {
  position: absolute;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  padding: 10px 14px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.96);
  color: #14182b;
  font-size: 0.85rem;
  line-height: 1.4;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  transition: opacity 120ms ease;
  white-space: nowrap;
}

#tooltip.visible {
  opacity: 1;
  visibility: visible;
}

#tooltip .tt-date {
  color: #5b6178;
  font-weight: 500;
}

#tooltip .tt-gdp {
  font-size: 1.1rem;
  font-weight: 600;
}
</style>

<main class="card">
      <header>
        <p class="eyebrow">Federal Reserve Economic Data</p>
        <h1 id="title">United States GDP</h1>
        <p class="subtitle">Quarterly gross domestic product, 1947 – 2015</p>
      </header>

      <div id="chart" class="chart" aria-label="Bar chart of US GDP over time"></div>

      <footer>
        <span>Units: billions of dollars, seasonally adjusted annual rate</span>
        <a href="http://www.bea.gov/national/pdf/nipaguid.pdf" target="_blank" rel="noopener">Source: BEA</a>
      </footer>
    </main>

    <div id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const DATA_URL =
  "https://raw.githubusercontent.com/freeCodeCamp/ProjectReferenceData/master/GDP-data.json";

const width = 920;
const height = 480;
const margin = { top: 20, right: 20, bottom: 60, left: 80 };
const innerWidth = width - margin.left - margin.right;
const innerHeight = height - margin.top - margin.bottom;

const formatGdp = (value) =>
  `$${d3.format(",.1f")(value)} Billion`;
const formatQuarter = (date) =>
  `${date.getUTCFullYear()} Q${Math.floor(date.getUTCMonth() / 3) + 1}`;

const svg = d3
  .select("#chart")
  .append("svg")
  .attr("viewBox", `0 0 ${width} ${height}`)
  .attr("preserveAspectRatio", "xMidYMid meet");

const plot = svg
  .append("g")
  .attr("transform", `translate(${margin.left}, ${margin.top})`);

const tooltip = d3.select("#tooltip");

fetch(DATA_URL)
  .then((response) => response.json())
  .then(({ data }) => render(data))
  .catch((error) => {
    d3.select("#chart")
      .append("p")
      .text(`Couldn't load the data: ${error.message}`);
  });

function render(data) {
  const parsed = data.map(([date, gdp]) => ({
    dateString: date,
    date: new Date(date),
    gdp,
  }));

  const lastDate = parsed[parsed.length - 1].date;
  const endDate = new Date(lastDate);
  endDate.setUTCMonth(endDate.getUTCMonth() + 3);

  const x = d3
    .scaleUtc()
    .domain([parsed[0].date, endDate])
    .range([0, innerWidth]);

  const maxGdp = d3.max(parsed, (d) => d.gdp);
  const y = d3.scaleLinear().domain([0, maxGdp]).nice().range([innerHeight, 0]);

  const color = d3
    .scaleLinear()
    .domain([0, maxGdp])
    .range([
      getComputedStyle(document.documentElement).getPropertyValue("--bar-low").trim(),
      getComputedStyle(document.documentElement).getPropertyValue("--bar-high").trim(),
    ])
    .interpolate(d3.interpolateHcl);

  // Horizontal gridlines behind the bars
  plot
    .append("g")
    .attr("class", "grid")
    .call(d3.axisLeft(y).tickSize(-innerWidth).tickFormat(""));

  const barWidth = innerWidth / parsed.length;

  plot
    .selectAll(".bar")
    .data(parsed)
    .join("rect")
    .attr("class", "bar")
    .attr("data-date", (d) => d.dateString)
    .attr("data-gdp", (d) => d.gdp)
    .attr("x", (d) => x(d.date))
    .attr("y", (d) => y(d.gdp))
    .attr("width", Math.max(barWidth - 0.6, 1))
    .attr("height", (d) => innerHeight - y(d.gdp))
    .attr("rx", 0.8)
    .attr("fill", (d) => color(d.gdp))
    .on("mouseover", (event, d) => {
      d3.select(event.currentTarget).classed("active", true);
      tooltip
        .attr("data-date", d.dateString)
        .html(
          `<div class="tt-date">${formatQuarter(d.date)}</div>` +
            `<div class="tt-gdp">${formatGdp(d.gdp)}</div>`
        )
        .classed("visible", true);
    })
    .on("mousemove", (event) => {
      const node = tooltip.node();
      const offset = 16;
      let left = event.pageX + offset;
      if (left + node.offsetWidth > window.scrollX + window.innerWidth) {
        left = event.pageX - node.offsetWidth - offset;
      }
      tooltip
        .style("left", `${left}px`)
        .style("top", `${event.pageY - node.offsetHeight - offset}px`);
    })
    .on("mouseout", (event) => {
      d3.select(event.currentTarget).classed("active", false);
      tooltip.classed("visible", false);
    });

  plot
    .append("g")
    .attr("id", "x-axis")
    .attr("class", "axis")
    .attr("transform", `translate(0, ${innerHeight})`)
    .call(d3.axisBottom(x).ticks(d3.utcYear.every(5)).tickFormat(d3.utcFormat("%Y")));

  plot
    .append("g")
    .attr("id", "y-axis")
    .attr("class", "axis")
    .call(d3.axisLeft(y).ticks(8).tickFormat(d3.format(",")));

  plot
    .append("text")
    .attr("class", "axis-label")
    .attr("transform", "rotate(-90)")
    .attr("x", -innerHeight / 2)
    .attr("y", -margin.left + 16)
    .attr("text-anchor", "middle")
    .text("Gross Domestic Product (US$ billions)");

  plot
    .append("text")
    .attr("class", "axis-label")
    .attr("x", innerWidth / 2)
    .attr("y", innerHeight + 44)
    .attr("text-anchor", "middle")
    .text("Year");
}
</script>
<script src="https://cdn.freecodecamp.org/testable-projects-fcc/v1/bundle.js"></script>
